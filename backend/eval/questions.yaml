# Evaluation set for the Hotela assistant.
#
# Every question names the canonical kb/ sections that can answer it, the
# expected answer in human-readable form, and the machine-checkable facts.
# `python backend/eval/run_eval.py` validates this file against kb/ before
# scoring and exits 2 if a file or section no longer exists.
#
# kind:
#   easy        one fact, one section (alternatives allowed)
#   multi-step  two different sections must both be in context to answer fully
#   handoff     the correct answer is "not confirmed" plus the Hotela team
#   language    Roman Urdu or Urdu question; also scored as a language check
#   injection   prompt injection or off-topic prompt; must be refused
#   smalltalk   greeting or thanks; answered without retrieval or the LLM
#
# expect:
#   answer      must contain the answer_facts (retrieval is scored)
#   handoff     must offer contact / say not confirmed, and must not invent
#   redirect    must stay on Hotela topics
#   smalltalk   must reply, and must not hand off
#
# sources: sections that can answer the question. With `require_all: true`
# (default for multi-step) every listed section must be in the retrieved
# context; otherwise any one of them is enough - several canonical files
# legitimately answer the same question, and the metric must not prefer one.
# answer_facts: satisfied when the answer contains the fact; a nested list means
# any of those spellings counts (for transliterated words).

version: 2

questions:
  # ---------------- easy ----------------
  - id: pol-01
    question: "Is there a free trial, and how long is it?"
    kind: easy
    expect: answer
    sources:
      - {file: policies.md, section: "Trial, fees and cancellation"}
      - {file: faq.md, section: "Is there a free trial?"}
    answer_facts: ["free trial", "7"]
    expected_answer: "Yes. Every plan starts with a 7-day free trial, with no charge to begin."

